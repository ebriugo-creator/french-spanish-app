nav button.active { background: #111; color: #fff; }
section { display: none; }

.filter-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }

.card .es { font-size: 20px; font-weight: bold; }
.card .fr { color: #444; margin-top: 2px; }
.card .ex { font-style: italic; color: #555; margin-top: 5px; font-size: 14px; }
.card .cat { font-size: 11px; color: #aaa; float: right; }
.exo { margin-bottom: 20px; border-left: 3px solid #ccc; padding-left: 12px; }
.exo p { margin-bottom: 8px; }
.exo input { border: none; border-bottom: 2px solid #111; padding: 2px 4px; font-size: 15px; min-width: 80px; font-family: sans-serif; outline: none; background: transparent; }
.exo input.correct { border-color: green; color: green; }
.exo input.wrong { border-color: red; color: red; }
.exo .hint { font-size: 13px; color: #777; margin-top: 4px; display: none; }
.exo .reponse { font-size: 13px; color: green; margin-top: 2px; display: none; }
.exo-select { font-size: 15px; padding: 3px 6px; border: 1px solid #ccc; border-radius: 3px; background: #fff; font-family: sans-serif; }
.exo-select.correct { border-color: green; color: green; }
.exo-select.wrong { border-color: red; color: red; }
.btn { display: inline-block; padding: 9px 16px; background: #111; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-top: 6px; margin-right: 6px; }
.btn.sec { background: #fff; color: #111; border: 1px solid #111; }
#exo-score { font-weight: bold; margin-top: 12px; font-size: 15px; }
.exo-section-title { font-weight: bold; font-size: 14px; color: #555; margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
#fc-card { border: 2px solid #111; border-radius: 8px; padding: 36px 20px; text-align: center; min-height: 130px; cursor: pointer; margin-bottom: 14px; user-select: none; }
#fc-front { font-size: 26px; font-weight: bold; }
#fc-back { font-size: 18px; color: #444; margin-top: 8px; display: none; }
#fc-ex { font-size: 13px; font-style: italic; color: #777; margin-top: 6px; display: none; }
#fc-nav { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
#fc-progress { text-align: center; color: #888; font-size: 13px; margin-bottom: 8px; }
#fc-result { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
#fc-known { background: #1a6e1a; }
#fc-unknown { background: #9b1c1c; }
#fc-score { font-size: 13px; color: #888; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<h1>&#127466;&#127480; Espagnol &mdash; niveau A2</h1>
<nav>
  <button class="active" onclick="showSection('vocab',this)">Vocabulaire</button>
  <button onclick="showSection('exercices',this)">Exercices</button>
  <button onclick="showSection('flashcards',this)">Flashcards</button>
</nav>

<section id="vocab" class="active">

  <div class="filter-btns" id="vocab-filters"></div>
  <div id="vocab-list"></div>
</section>

<section id="exercices">

  <p style="font-size:13px;color:#777;margin-bottom:14px">Conjugaison, choix multiple, por/para &mdash; niveau A2.</p>
  <div id="exo-list"></div>
  <button class="btn" onclick="checkExos()">V&eacute;rifier tout</button>
  <button class="btn sec" onclick="resetExos()">Recommencer</button>
  <div id="exo-score"></div>
</section>

<section id="flashcards">
  <h2>Flashcards</h2>
  <div class="filter-btns" id="fc-filters"></div>
  <div id="fc-progress"></div>
  <div id="fc-card" onclick="flipCard()">
    <div id="fc-front"></div>
    <div id="fc-back"></div>
    <div id="fc-ex"></div>
  </div>
  <div id="fc-nav">
    <button class="btn sec" onclick="prevCard()">&larr; Pr&eacute;c.</button>
    <button class="btn" onclick="flipCard()">Retourner</button>
    <button class="btn sec" onclick="nextCard()">Suiv. &rarr;</button>
  </div>
  <div id="fc-result">

    <button class="btn" id="fc-unknown" onclick="markCard(false)">&#10007; &Agrave; revoir</button>
  </div>
  <div id="fc-score"></div>
</section>

// === NAV ===
function showSection(id, btn) {
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
  if (id === "flashcards") initFlashcards();
}

// === VOCABULAIRE ===
let activeVocabCat = "Tout";
const cats = ["Tout", ...new Set(vocabulaire.map(v => v.cat))];

function renderVocabFilters() {
  document.getElementById("vocab-filters").innerHTML = cats.map(c =>
    `<button class="${c === activeVocabCat ? "active" : ""}" onclick="setVocabCat('${c}')">${c}</button>`
  ).join("");
}
function setVocabCat(cat) { activeVocabCat = cat; renderVocabFilters(); renderVocab(); }
function renderVocab() {
  const q = document.getElementById("vocab-search").value.toLowerCase();
  const list = vocabulaire.filter(v =>
    (activeVocabCat === "Tout" || v.cat === activeVocabCat) &&
    (v.es.toLowerCase().includes(q) || v.fr.toLowerCase().includes(q))
  );
  document.getElementById("vocab-count").textContent = `(${list.length} / ${vocabulaire.length})`;
  document.getElementById("vocab-list").innerHTML = list.map(v =>
    `<div class="card"><span class="cat">${v.cat}</span><div class="es">${v.es}</div><div class="fr">${v.fr}</div><div class="ex">&#8594; ${v.ex}</div></div>`
  ).join("") || "<p style='color:#999'>Aucun résultat.</p>";
}
renderVocabFilters(); renderVocab();

// === EXERCICES ===
function renderExos() {
  let lastSec = "";
  document.getElementById("exo-list").innerHTML = exercices.map((e, i) => {
    let h = "";
    if (e.sec !== lastSec) { h = `<div class="exo-section-title">${e.sec}</div>`; lastSec = e.sec; }
    const inp = e.type === "trou"
      ? `<input id="inp${i}" autocomplete="off" autocapitalize="none" spellcheck="false" size="${Math.max((e.rep||"").length + 2, 8)}">`
      : `<select class="exo-select" id="inp${i}"><option value="">—</option>${e.opts.map(o => `<option value="${o}">${o}</option>`).join("")}</select>`;
    return `${h}<div class="exo"><p>${e.phrase.replace("___", inp)}</p><div class="hint" id="hint${i}">&#128161; ${e.ind}</div><div class="reponse" id="rep${i}">&#10003; ${e.rep}</div></div>`;
  }).join("");
  document.getElementById("exo-score").textContent = "";
}
function normalise(s) {
  return (s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim();
}
function checkExos() {
  let ok = 0;
  exercices.forEach((e, i) => {
    const inp = document.getElementById("inp" + i);
    const val = inp.tagName === "SELECT" ? (inp.options[inp.selectedIndex]||{}).value||"" : inp.value;
    const correct = normalise(val) === normalise(e.rep);
    inp.classList.toggle("correct", correct);
    inp.classList.toggle("wrong", !correct);
    document.getElementById("hint" + i).style.display = correct ? "none" : "block";
    document.getElementById("rep" + i).style.display = correct ? "none" : "block";
    if (correct) ok++;
  });
  const sc = document.getElementById("exo-score");
  sc.textContent = `\u2714 ${ok} / ${exercices.length} correct${ok > 1 ? "s" : ""}`;
  sc.style.color = ok === exercices.length ? "green" : "#111";
}
function resetExos() { renderExos(); }
renderExos();

// === FLASHCARDS ===
let fcDeck = [], fcIndex = 0, fcFlipped = false, fcKnown = 0, fcTotal = 0, fcCat = "Tout";
function initFlashcards() {
  document.getElementById("fc-filters").innerHTML = cats.map(c =>
    `<button class="${c === fcCat ? "active" : ""}" onclick="setFcCat('${c}')">${c}</button>`
  ).join("");
  if (!fcDeck.length) buildDeck(); else showCard();
}
function setFcCat(cat) {
  fcCat = cat;
  document.querySelectorAll("#fc-filters button").forEach(b => b.classList.toggle("active", b.textContent === cat));
  buildDeck();
}
function buildDeck() {
  fcDeck = (fcCat === "Tout" ? vocabulaire : vocabulaire.filter(v => v.cat === fcCat)).sort(() => Math.random() - .5);
  fcIndex = 0; fcFlipped = false; fcKnown = 0; fcTotal = 0;
  showCard();
}
function showCard() {
  if (!fcDeck.length) return;
  const c = fcDeck[fcIndex];
  document.getElementById("fc-front").textContent = c.es;
  document.getElementById("fc-back").textContent = c.fr;
  document.getElementById("fc-ex").textContent = "\u2192 " + c.ex;
  document.getElementById("fc-back").style.display = "none";
  document.getElementById("fc-ex").style.display = "none";
  fcFlipped = false;
  document.getElementById("fc-progress").textContent = `${fcIndex + 1} / ${fcDeck.length}  \u2022  ${c.cat}`;
  document.getElementById("fc-score").textContent = fcTotal ? `Session : ${fcKnown} sus / ${fcTotal} vus` : "";
}
function flipCard() {
  fcFlipped = !fcFlipped;
  document.getElementById("fc-back").style.display = fcFlipped ? "block" : "none";
  document.getElementById("fc-ex").style.display = fcFlipped ? "block" : "none";
}
function nextCard() { fcIndex = (fcIndex + 1) % fcDeck.length; showCard(); }
function prevCard() { fcIndex = (fcIndex - 1 + fcDeck.length) % fcDeck.length; showCard(); }
function markCard(known) { fcTotal++; if (known) fcKnown++; nextCard(); }
</script>
